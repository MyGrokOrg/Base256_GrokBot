name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      compile_refs:
        description: "compile-time job: extra git revisions to measure next to the tree (space-separated)"
        required: false
        default: ""

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cxx: [g++, clang++]
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -B build -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build --output-on-failure -C Release

  mpfr:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cxx: [g++, clang++]
    steps:
      - uses: actions/checkout@v5
      - name: Install MPFR
        run: sudo apt-get update && sudo apt-get install -y libmpfr-dev
      - name: Configure
        run: cmake -B build -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} -DCMAKE_BUILD_TYPE=Release -DBASE256_MPFR_TESTS=ON -DBASE256_MPFR_CASES=20000 -DBASE256_ULP_CASES=1000
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build --output-on-failure -C Release

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install MPFR
        run: sudo apt-get update && sudo apt-get install -y libmpfr-dev
      - name: Configure
        run: cmake -B build -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBASE256_MPFR_TESTS=ON -DBASE256_MPFR_CASES=1500 -DBASE256_ULP_CASES=40 "-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-sanitize-recover=undefined"
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  compile-time:
    # Compile time (gcc-14, clang-19, -O2, mean of 5) of representative TUs and the
    # header size, measured next to the baseline revision in
    # tools/compile_time_baseline.json on the same runner. Warns (never fails)
    # when a TU's mean grows more than 10 % or the headers more than 10 %.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install clang-19
        run: sudo apt-get update && sudo apt-get install -y clang-19
      - name: Measure
        env:
          COMPILE_REFS: ${{ github.event.inputs.compile_refs }}
        run: |
          refs=""
          for r in $COMPILE_REFS; do refs="$refs --ref $r"; done
          python3 tools/compile_time.py --cxx g++-14,clang++-19 -n 5 --threshold 0.10 $refs \
            --compare tools/compile_time_baseline.json | tee compile-time.log
          { echo '### Compile time (warn-only, threshold +10 %)'; grep -v '^::' compile-time.log; } >> "$GITHUB_STEP_SUMMARY"
