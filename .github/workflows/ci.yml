name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      compile_refs:
        description: "compile-time job: extra git revisions to measure next to the tree (space-separated)"
        required: false
        default: ""

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cxx: [g++, clang++]
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -B build -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build --output-on-failure -C Release

  mpfr:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cxx: [g++, clang++]
    steps:
      - uses: actions/checkout@v5
      - name: Install MPFR
        run: sudo apt-get update && sudo apt-get install -y libmpfr-dev
      - name: Configure
        run: cmake -B build -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} -DCMAKE_BUILD_TYPE=Release -DBASE256_MPFR_TESTS=ON -DBASE256_MPFR_CASES=20000 -DBASE256_ULP_CASES=1000
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build --output-on-failure -C Release

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install MPFR
        run: sudo apt-get update && sudo apt-get install -y libmpfr-dev
      - name: Configure
        run: cmake -B build -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBASE256_MPFR_TESTS=ON -DBASE256_MPFR_CASES=1500 -DBASE256_ULP_CASES=40 "-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-sanitize-recover=undefined"
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  # Other toolchains: the whole ctest suite (test_uint on the 64-bit-word path, and
  # digest_golden: the default-path digests must equal tests/digest_golden.txt, made
  # with g++-14 on x86-64) with warnings as errors. No MPFR here.
  portability:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: MSVC (windows-latest, /W4 /WX)
            os: windows-latest
            flags: /W4 /WX /permissive- /EHsc
          - name: Apple Clang (macos-latest, -Werror)
            os: macos-latest
            flags: -Wall -Wextra -Wpedantic -Werror
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        shell: bash
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release "-DCMAKE_CXX_FLAGS=${{ matrix.flags }}"
      - name: Build
        shell: bash
        run: cmake --build build --config Release -j 4
      - name: Test
        shell: bash
        run: ctest --test-dir build --output-on-failure -C Release -j 4

  default-path:
    # The thread-mode (default) path must stay bit-identical to 4.25.0 (98a3143):
    # tools/mode_digest.sh builds tools/mode_digest.cpp against the 98a3143 headers
    # and the tree and fails on any digest difference (result bits and flags, all
    # 5 modes, arithmetic, conversions, text, every function, complex). test_percall
    # checks every per-call overload against the global path (bits, flags, mode).
    # Recorded exceptions to bit-identity with 4.25.0 (none needs a digest override):
    #  - atan2 tiny-ratio fix (y/x in or below the subnormal range): 4.25.0 was wrong
    #    there (flushed to 0, lost underflow/inexact, double rounding). mode_digest's
    #    arguments (|v| in 2^[-30, 30]) never reach that branch: all 133 digests stay
    #    identical (g++-14, clang++-19, 200000 24). Pinned by test_math_flags/test_complex.
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash  # -eo pipefail: a failing command before tee fails the step
    strategy:
      fail-fast: false
      matrix:
        cxx: [g++-14, clang++-19]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install clang-19
        if: matrix.cxx == 'clang++-19'
        run: sudo apt-get update && sudo apt-get install -y clang-19
      - name: Default path vs 98a3143
        run: bash tools/mode_digest.sh 98a3143 ${{ matrix.cxx }} 200000 24 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Per-call == global (test_percall)
        run: |
          ${{ matrix.cxx }} -std=c++23 -O2 -Wall -Wextra -Wpedantic -Werror -Iinclude tests/test_percall.cpp -o test_percall
          ./test_percall | tail -1 | tee -a "$GITHUB_STEP_SUMMARY"

  compile-time:
    # Compile time (gcc-14, clang-19, -O2, mean of 5) of representative TUs and the
    # header sizes, per header group (core = what base256.hpp includes; complex =
    # what complex.hpp adds), each measured next to its own baseline revision in
    # tools/compile_time_baseline.json on the same runner. Warns (never fails)
    # when a TU's mean or a group's header bytes grow more than 10 %.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install clang-19
        run: sudo apt-get update && sudo apt-get install -y clang-19
      - name: Measure
        env:
          COMPILE_REFS: ${{ github.event.inputs.compile_refs }}
        run: |
          refs=""
          for r in $COMPILE_REFS; do refs="$refs --ref $r"; done
          python3 tools/compile_time.py --cxx g++-14,clang++-19 -n 5 --threshold 0.10 $refs \
            --compare tools/compile_time_baseline.json | tee compile-time.log
          { echo '### Compile time (warn-only, threshold +10 %)'; grep -v '^::' compile-time.log; } >> "$GITHUB_STEP_SUMMARY"
